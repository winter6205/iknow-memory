name: test

# Three jobs:
#
#   test-fast  — PR gate (required check). Fast vitest subset without Postgres.
#   test-full  — nightly cron + manual dispatch. Full suite with Postgres
#                service plus Compose Elasticsearch (+ analysis-ik) so
#                tests/integration/bm25-pg.test.ts cannot loud-skip.
#   test-es    — PR/main gate. Builds only the elasticsearch compose
#                service and runs the live precision-layer suite.
#
# Local WSL `npm test` is ground truth; excludes only affect CI runners.
# Do not delete tests — use --exclude to express CI policy.
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Check test excludes (CI guard)
        run: npx tsx scripts/ci-check-test-excludes.ts
      - name: Vitest fast subset (bail-10 + retry-1)
        # slow-path (fast-only): tests/integration/** glob, plus postgres-dependent
        #   files outside that directory (taxonomy: directory-outside append).
        # assembly / physical bwrap / TUI flake: none in this repo (guard still
        #   scans assembly call-forms; hits would need both jobs).
        # Local WSL `npm test` runs the full suite; CI only shortens PR feedback.
        run: |
          npx vitest run --retry 1 --bail=10 \
            --exclude 'tests/integration/**' \
            --exclude tests/cli/extract-relation-pg.test.ts \
            --exclude tests/cli/extract-list-failed.test.ts \
            --exclude tests/cli/extract.test.ts \
            --exclude tests/cli/extract-e2e-graph.test.ts \
            --exclude tests/cli/consolidate-pg.test.ts \
            --exclude tests/schema-bootstrap.test.ts \
            --exclude tests/storage/bootstrap-columns.test.ts \
            --exclude tests/storage/pgvector-startup.test.ts \
            --exclude tests/storage/source-documents-pg.test.ts \
            --exclude tests/storage/storage-reads-pg.test.ts \
            --exclude tests/structured/identity-store-pg.test.ts

  test-es:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start Elasticsearch + analysis-ik
        # ES refuses to boot below vm.max_map_count=262144; the runner may
        # already satisfy this, but setting it keeps the job independent of
        # the host default (docker-compose.yml documents the same requirement).
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker compose up -d --wait --no-deps elasticsearch
      - name: Verify ES is reachable from the runner
        # The compose healthcheck only proves the container's own loopback
        # answers; `up --wait` returning "healthy" does NOT prove the host's
        # published path works. scripts/wait-for-es.sh polls until the port
        # answers. See its header for the failures that motivated it.
        env:
          ES_URL: http://127.0.0.1:9200
        run: bash scripts/wait-for-es.sh
      - name: ES reachability diagnostics
        if: failure()
        run: |
          echo "::group::ES host reachability diagnostics"
          docker compose ps
          ss -ltn | grep -E '9200|9300' || echo "(no host listener on 9200/9300)"
          docker inspect iknow-memory-es \
            --format '{{json .NetworkSettings.Ports}}' || true
          docker logs --tail 60 iknow-memory-es || true
          echo "::endgroup::"
      - name: Live precision-layer suite
        env:
          GRAPHRAG_MEMORY_ES_URL: http://127.0.0.1:9200
        run: npx vitest run --retry 1 tests/integration/bm25-pg.test.ts

  test-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GRAPHRAG_MEMORY_DB_URL: postgresql://postgres@localhost:5432/postgres
      # 127.0.0.1 rather than localhost, per docs/mcp-config.md: the host
      # side should not depend on where getaddrinfo puts ::1 vs 127.0.0.1.
      # (Not the cause of the first test-es failure — that was a transient
      # connection reset from the published port; see wait-for-es.sh.)
      GRAPHRAG_MEMORY_ES_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Check test excludes (CI guard)
        run: npx tsx scripts/ci-check-test-excludes.ts
      - name: Start Elasticsearch + analysis-ik
        # Same vm.max_map_count step as test-es; the Postgres service above
        # is the workflow service, not compose — only ES comes from compose.
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker compose up -d --wait --no-deps elasticsearch
      - name: Verify ES is reachable from the runner
        # Same gate as test-es. Without it, an unreachable ES does not fail
        # this job — it makes bm25-pg loud-skip, which is exactly the hole
        # #226 closes (the nightly reported `fetch failed` + 4 skipped for
        # weeks without ever going red).
        env:
          ES_URL: http://127.0.0.1:9200
        run: bash scripts/wait-for-es.sh
      - name: ES reachability diagnostics
        if: failure()
        run: |
          echo "::group::ES host reachability diagnostics"
          docker compose ps
          ss -ltn | grep -E '9200|9300' || echo "(no host listener on 9200/9300)"
          docker inspect iknow-memory-es \
            --format '{{json .NetworkSettings.Ports}}' || true
          docker logs --tail 60 iknow-memory-es || true
          echo "::endgroup::"
      - name: Vitest full suite (retry-1)
        run: npx vitest run --retry 1
